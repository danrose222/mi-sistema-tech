# Reverse proxy para Cel Shop Center.
# Copiar a /etc/nginx/sites-available/celshopcenter.conf en el VPS y linkear:
#   sudo ln -s /etc/nginx/sites-available/celshopcenter.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado TLS (Let's Encrypt, primera vez):
#   sudo certbot --nginx -d celshopcenter.com.ar -d www.celshopcenter.com.ar
# Certbot reescribe automáticamente los bloques `listen 443` y las rutas de
# certificado de este archivo la primera vez que se corre.

# Redirige el dominio raíz al www (mismo host que FRONTEND_URL en el backend).
server {
    listen 80;
    listen [::]:80;
    server_name celshopcenter.com.ar;
    return 301 https://www.celshopcenter.com.ar$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.celshopcenter.com.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.celshopcenter.com.ar;

    # Rutas de certificado gestionadas por certbot — placeholder hasta la
    # primera corrida de `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/www.celshopcenter.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.celshopcenter.com.ar/privkey.pem;

    client_max_body_size 10M; # margen sobre el límite de 5MB por archivo del backend

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API y archivos subidos (imágenes de producto) → backend (puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Resto del sitio (panel admin + catálogo público con SSR) → frontend (puerto 4000)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
