# Reverse proxy para Cel Shop Center.
# Copiar a /etc/nginx/sites-available/celshopcenter.conf en el VPS y linkear:
#   sudo ln -s /etc/nginx/sites-available/celshopcenter.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado TLS (Let's Encrypt, ya emitido en producción):
#   sudo certbot --nginx -d celshopcenter.com.ar -d www.celshopcenter.com.ar
# Certbot guarda el certificado bajo el PRIMER dominio pasado con -d
# (/etc/letsencrypt/live/celshopcenter.com.ar/, sin "www."), por eso las
# rutas de abajo no llevan el prefijo aunque el sitio real viva en el host
# "www". Si se emite de nuevo el certificado, revisar que la ruta siga
# coincidiendo.

# Redirige el dominio raíz al www (mismo host que FRONTEND_URL en el backend).
server {
    listen 80;
    listen [::]:80;
    server_name celshopcenter.com.ar;
    return 301 https://www.celshopcenter.com.ar$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.celshopcenter.com.ar;
    return 301 https://$host$request_uri;
}

# Certbot emite un único certificado para ambos nombres (celshopcenter.com.ar
# como dominio principal, ver -d en el comando de arriba), pero el sitio real
# solo vive en el bloque de abajo, con host canónico "www" — este bloque
# existe solo para redirigir ahí a quien llegue por HTTPS directo a la raíz.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name celshopcenter.com.ar;

    ssl_certificate     /etc/letsencrypt/live/celshopcenter.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celshopcenter.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.celshopcenter.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.celshopcenter.com.ar;

    ssl_certificate     /etc/letsencrypt/live/celshopcenter.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celshopcenter.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M; # margen sobre el límite de 5MB por archivo del backend

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API y archivos subidos (imágenes de producto) → backend (puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Resto del sitio (panel admin + catálogo público con SSR) → frontend (puerto 4000)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
